<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#0C2340" />
    <meta name="color-scheme" content="only light" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <meta name="apple-mobile-web-app-title" content="HelioHandover" />
    <link rel="apple-touch-icon" href="/icon-192.png" />
    <title>HelioHandover</title>
    <style>
      :root { color-scheme: only light; }
      html { background: #F1F5F9; }
      body { margin: 0; }
      #fallback {
        display: none;
        position: fixed; inset: 0;
        background: #0C2340;
        align-items: center; justify-content: center;
        font-family: -apple-system, sans-serif;
        padding: 20px;
        z-index: 99999;
      }
      #fallback .card {
        background: white; border-radius: 16px;
        padding: 28px; max-width: 320px;
        width: 100%; text-align: center;
      }
      #fallback h2 { color: #0C2340; font-size: 18px; margin: 12px 0 8px; }
      #fallback p  { color: #6B7280; font-size: 14px; line-height: 1.6; margin: 0 0 20px; }
      #fallback button {
        background: #0C2340; color: white;
        border: none; border-radius: 8px;
        padding: 12px 24px; font-size: 15px;
        font-weight: 600; cursor: pointer;
        width: 100%; margin-bottom: 10px;
      }
      #fallback .alt { background: white; color: #0C2340; border: 1px solid #E5E7EB; }
    </style>
  </head>
  <body>
    <div id="root"></div>
    <div id="fallback">
      <div class="card">
        <div style="font-size:48px">🏥</div>
        <h2>HelioHandover</h2>
        <p>The app couldn't load on this device.<br>Try the steps below:</p>
        <button onclick="hardReload()">🔄 Reload App</button>
        <button class="alt" onclick="window.location.href = window.location.href">Open in Safari Browser</button>
        <p style="font-size:12px;color:#9CA3AF;margin-top:12px">
          If the problem continues, update your device's browser.
        </p>
      </div>
    </div>
    <script>
      var _t = setTimeout(function () {
        var root = document.getElementById("root");
        if (!root || !root.firstChild) {
          var fb = document.getElementById("fallback");
          if (fb) fb.style.display = "flex";
        }
      }, 5000);
      var _obs = new MutationObserver(function () {
        var root = document.getElementById("root");
        if (root && root.firstChild) {
          clearTimeout(_t);
          _obs.disconnect();
          var fb = document.getElementById("fallback");
          if (fb) fb.style.display = "none";
        }
      });
      _obs.observe(document.getElementById("root"), { childList: true });
      function hardReload() {
        try { localStorage.removeItem("hh_auth_v1"); } catch (e) {}
        try { caches.keys().then(function (keys) { keys.forEach(function (k) { caches.delete(k); }); }); } catch (e) {}
        window.location.reload(true);
      }
    </script>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
